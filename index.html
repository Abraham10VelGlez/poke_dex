<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Poke Dex</title>
    <link rel="stylesheet" href="index.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet" />

    <link rel="icon" type="image/png" href="img/pokeblack.png">
  </head>

  <body>
    <div class="header">
      <div class="shimmer-text">Pokedex</div>

      <div class="toggle-wrapper">
        <input type="checkbox" id="toggle" />
        <div class="glow"></div>
        <label for="toggle" class="toggle-track">
          <div class="toggle-thumb">
            <div class="icon-moon"></div>
            <div class="icon-sun"></div>
          </div>
        </label>

        <button class="menu-btn" id="menuBtn" aria-label="Menu">
          <img src="img/pokeblack.png" class="menu-btn-pokeball" alt="Menu">
        </button>
      </div>
    </div>

    <nav class="dropdown-menu" id="dropdownMenu">
      <a href="#" class="menu-item" data-id="1">
        <div class="pokeball">
          <img src="img/pokeblack.png" alt="Inicio" class="pokeball-img">
          <div class="pokeball-glow"></div>
        </div>
        <span class="menu-label">Inicio</span>
      </a>
      <a href="#" class="menu-item" data-id="2">
        <div class="pokeball">
          <img src="img/pokeamar.png" alt="Entrenador" class="pokeball-img">
          <div class="pokeball-glow"></div>
        </div>
        <span class="menu-label">Entrenador</span>
      </a>
      <a href="#" class="menu-item" data-id="3">
        <div class="pokeball">
          <img src="img/pokeblack.png" alt="Analisis" class="pokeball-img">
          <div class="pokeball-glow"></div>
        </div>
        <span class="menu-label">Analisis</span>
      </a>
      <a href="#" class="menu-item" data-id="4">
        <div class="pokeball">
          <img src="img/pokeamar.png" alt="Buscador" class="pokeball-img">
          <div class="pokeball-glow"></div>
        </div>
        <span class="menu-label">Buscador</span>
      </a>
      <a href="#" class="menu-item" data-id="5">
        <div class="pokeball">
          <img src="img/pokeblack.png" alt="Acerca" class="pokeball-img">
          <div class="pokeball-glow"></div>
        </div>
        <span class="menu-label">Acerca</span>
      </a>
      <a href="#" class="menu-item" data-id="6">
        <div class="pokeball">
          <img src="img/pokeamar.png" alt="Mas" class="pokeball-img">
          <div class="pokeball-glow"></div>
        </div>
        <span class="menu-label">Mas</span>
      </a>
    </nav>

    <main class="pokedex-container" id="pokedex">
      
    </main>

    <div class="pokemon-modal" id="pokemonModal">
      <div class="pokemon-modal-content" id="pokemonModalContent"></div>
      <button class="pokemon-modal-close" id="pokemonModalClose">&times;</button>
    </div>

    <footer class="footer">
      <b style="color: white;">Web site free all people, by developed Zury and Abrajam...</b>
    </footer>
    <script>
      const pokedex = document.getElementById("pokedex");
      const loading = document.getElementById("loading");

      const TYPE_COLORS = {
        normal: "#A8A878",
        fire: "#F08030",
        water: "#6890F0",
        electric: "#F8D030",
        grass: "#78C850",
        ice: "#98D8D8",
        fighting: "#C03028",
        poison: "#A040A0",
        ground: "#E0C068",
        flying: "#A890F0",
        psychic: "#F85888",
        bug: "#A8B820",
        rock: "#B8A038",
        ghost: "#705898",
        dragon: "#7038F8",
        dark: "#705848",
        steel: "#B8B8D0",
        fairy: "#EE99AC",
      };

      const TOTAL_POKEMON = 1025;
      const BATCH = 20;
      let shuffledIds = [];
      let currentIndex = 0;
      let isLoading = false;
      let allLoaded = false;

      function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      }

      function createCard(poke) {
        const card = document.createElement("div");
        card.className = "pokemon-card-liquid";

        const imgSrc = poke.sprites.other["official-artwork"].front_default || poke.sprites.front_default;
        const cryUrl = poke.cries?.latest || null;
        const types = poke.types
          .map(
            (t) =>
              `<span class="type-badge" style="background:${TYPE_COLORS[t.type.name] || '#777'}">${t.type.name}</span>`
          )
          .join("");

        card.innerHTML = `
          <div class="pokemon-img-wrapper">
            <img src="${imgSrc}" alt="${poke.name}" class="pokemon-img" loading="lazy">
          </div>
          <div class="pokemon-id">#${String(poke.id).padStart(3, "0")}</div>
          <div class="pokemon-name-liquid">${poke.name}</div>
          <div class="pokemon-types">${types}</div>
          <div class="pokemon-stats">
            <div class="stat"><span>HP</span><span>${poke.stats[0].base_stat}</span></div>
            <div class="stat"><span>ATK</span><span>${poke.stats[1].base_stat}</span></div>
            <div class="stat"><span>DEF</span><span>${poke.stats[2].base_stat}</span></div>
          </div>
        `;

        card.dataset.img = imgSrc;
        card.dataset.name = poke.name;
        card.dataset.id = poke.id;
        card.dataset.types = JSON.stringify(poke.types.map(t => ({ name: t.type.name })));
        card.dataset.stats = JSON.stringify(poke.stats.map(s => ({ name: s.stat.name, value: s.base_stat })));
        card.dataset.cry = cryUrl || "";

        card.addEventListener("click", () => openPokemonModal(card.dataset));
        return card;
      }

      async function loadBatch() {
        if (isLoading || allLoaded) return;
        isLoading = true;

        const batchIds = shuffledIds.slice(currentIndex, currentIndex + BATCH);
        if (batchIds.length === 0) {
          allLoaded = true;
          isLoading = false;
          const ld = document.getElementById("loading");
          if (ld) ld.remove();
          return;
        }
        currentIndex += batchIds.length;

        const spinner = document.createElement("div");
        spinner.className = "loading";
        spinner.id = "loading";
        spinner.textContent = "Cargando mas Pokemon...";
        pokedex.appendChild(spinner);

        try {
          const details = await Promise.all(
            batchIds.map((id) =>
              fetch(`https://pokeapi.co/api/v2/pokemon/${id}`).then((r) => r.json())
            )
          );

          spinner.remove();

          details.forEach((poke) => {
            pokedex.appendChild(createCard(poke));
          });

          if (currentIndex >= TOTAL_POKEMON) {
            allLoaded = true;
          }
        } catch (err) {
          spinner.textContent = "Error al cargar. Intenta de nuevo.";
          console.error(err);
        }

        isLoading = false;
      }

      async function init() {
        shuffledIds = shuffleArray([...Array(TOTAL_POKEMON).keys()].map((i) => i + 1));
        await loadBatch();
      }

      window.addEventListener("scroll", () => {
        if (
          window.innerHeight + window.scrollY >= document.body.offsetHeight - 400
        ) {
          loadBatch();
        }
      });

      init();

      const menuBtn = document.getElementById("menuBtn");
      const dropdownMenu = document.getElementById("dropdownMenu");

      menuBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        menuBtn.classList.toggle("active");
        dropdownMenu.classList.toggle("show");
      });

      document.addEventListener("click", (e) => {
        if (!dropdownMenu.contains(e.target) && !menuBtn.contains(e.target)) {
          menuBtn.classList.remove("active");
          dropdownMenu.classList.remove("show");
        }
      });

      dropdownMenu.querySelectorAll(".menu-item").forEach((item) => {
        item.addEventListener("click", () => {
          menuBtn.classList.remove("active");
          dropdownMenu.classList.remove("show");
        });
      });

      const pokemonModal = document.getElementById("pokemonModal");
      const pokemonModalContent = document.getElementById("pokemonModalContent");
      const pokemonModalClose = document.getElementById("pokemonModalClose");
      let currentAudio = null;

      function openPokemonModal(data) {
        const types = JSON.parse(data.types);
        const stats = JSON.parse(data.stats);

        const typesHTML = types
          .map(t => `<span class="type-badge" style="background:${TYPE_COLORS[t.name] || '#777'}">${t.name}</span>`)
          .join("");

        const statsHTML = stats
          .filter(s => ["hp", "attack", "defense"].includes(s.name))
          .map(s => {
            const label = { hp: "HP", attack: "ATK", defense: "DEF" }[s.name];
            return `<div class="stat"><span>${label}</span><span>${s.value}</span></div>`;
          })
          .join("");

        const soundBtnHTML = data.cry
          ? `<button class="modal-sound-btn" id="cryBtn">&#128264; Sonido</button>`
          : "";

        pokemonModalContent.innerHTML = `
          <img class="modal-pokemon-img" src="${data.img}" alt="${data.name}">
          <div class="modal-pokemon-id">#${String(data.id).padStart(3, "0")}</div>
          <div class="modal-pokemon-name">${data.name}</div>
          <div class="modal-pokemon-types">${typesHTML}</div>
          <div class="modal-pokemon-stats">${statsHTML}</div>
          ${soundBtnHTML}
        `;

        pokemonModal.classList.add("show");
        document.body.style.overflow = "hidden";

        if (data.cry) {
          const cryBtn = document.getElementById("cryBtn");
          cryBtn.addEventListener("click", () => {
            if (currentAudio) {
              currentAudio.pause();
              currentAudio.currentTime = 0;
              cryBtn.classList.remove("playing");
              currentAudio = null;
              return;
            }
            currentAudio = new Audio(data.cry);
            currentAudio.play();
            cryBtn.classList.add("playing");
            currentAudio.addEventListener("ended", () => {
              cryBtn.classList.remove("playing");
              currentAudio = null;
            });
          });

          setTimeout(() => {
            currentAudio = new Audio(data.cry);
            currentAudio.play();
            cryBtn.classList.add("playing");
            currentAudio.addEventListener("ended", () => {
              cryBtn.classList.remove("playing");
              currentAudio = null;
            });
          }, 400);
        }
      }

      function closePokemonModal() {
        pokemonModal.classList.remove("show");
        document.body.style.overflow = "";
        if (currentAudio) {
          currentAudio.pause();
          currentAudio.currentTime = 0;
          currentAudio = null;
        }
      }

      pokemonModalClose.addEventListener("click", closePokemonModal);
      pokemonModal.addEventListener("click", (e) => {
        if (e.target === pokemonModal) closePokemonModal();
      });

      const modal = document.querySelector(".modal");
      const checkbox = document.querySelector("#close-modal");
      modal.addEventListener("click", (e) => {
        if (e.target === modal) checkbox.checked = true;
      });
    
    </script>
  </body>
</html>
