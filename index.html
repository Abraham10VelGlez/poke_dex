<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Poke Dex</title>
    <link rel="stylesheet" href="index.css" />
  </head>

  <body>
    <div class="header">
      <div class="shimmer-text">Pokedex</div>

      <div class="toggle-wrapper">
        <input type="checkbox" id="toggle" />
        <div class="glow"></div>
        <label for="toggle" class="toggle-track">
          <div class="toggle-thumb">
            <div class="icon-moon"></div>
            <div class="icon-sun"></div>
          </div>
        </label>
      </div>
    </div>

    <main class="pokedex-container" id="pokedex">
      <div class="loading" id="loading">Cargando Pokemon...</div>
    </main>

    <footer class="footer">
      <b style="color: white;">Web site free all people, by developed Zury and Abrajam...</b>
    </footer>
    <script>
      const API_URL = "https://pokeapi.co/api/v2/pokemon?limit=20";
      const pokedex = document.getElementById("pokedex");
      const loading = document.getElementById("loading");

      const TYPE_COLORS = {
        normal: "#A8A878",
        fire: "#F08030",
        water: "#6890F0",
        electric: "#F8D030",
        grass: "#78C850",
        ice: "#98D8D8",
        fighting: "#C03028",
        poison: "#A040A0",
        ground: "#E0C068",
        flying: "#A890F0",
        psychic: "#F85888",
        bug: "#A8B820",
        rock: "#B8A038",
        ghost: "#705898",
        dragon: "#7038F8",
        dark: "#705848",
        steel: "#B8B8D0",
        fairy: "#EE99AC",
      };

      async function fetchPokemon() {
        try {
          const res = await fetch(API_URL);
          const data = await res.json();

          const details = await Promise.all(
            data.results.map((p) => fetch(p.url).then((r) => r.json()))
          );

          loading.remove();

          details.forEach((poke) => {
            const card = document.createElement("div");
            card.className = "pokemon-card-liquid";

            const types = poke.types
              .map(
                (t) =>
                  `<span class="type-badge" style="background:${TYPE_COLORS[t.type.name] || '#777'}">${t.type.name}</span>`
              )
              .join("");

            card.innerHTML = `
              <div class="pokemon-img-wrapper">
                <img src="${poke.sprites.other["official-artwork"].front_default || poke.sprites.front_default}" alt="${poke.name}" class="pokemon-img" loading="lazy">
              </div>
              <div class="pokemon-id">#${String(poke.id).padStart(3, "0")}</div>
              <div class="pokemon-name-liquid">${poke.name}</div>
              <div class="pokemon-types">${types}</div>
              <div class="pokemon-stats">
                <div class="stat"><span>HP</span><span>${poke.stats[0].base_stat}</span></div>
                <div class="stat"><span>ATK</span><span>${poke.stats[1].base_stat}</span></div>
                <div class="stat"><span>DEF</span><span>${poke.stats[2].base_stat}</span></div>
              </div>
            `;

            pokedex.appendChild(card);
          });
        } catch (err) {
          loading.textContent = "Error al cargar Pokemon. Intenta de nuevo.";
          console.error(err);
        }
      }

      fetchPokemon();

      const modal = document.querySelector(".modal");
      const checkbox = document.querySelector("#close-modal");
      modal.addEventListener("click", (e) => {
        if (e.target === modal) checkbox.checked = true;
      });
    </script>
  </body>
</html>
